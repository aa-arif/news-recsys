[project]
name = "news-recsys"
version = "0.1.0"
description = "Two-stage news recommender on MIND: retrieval (two-tower + FAISS) and ranking (DIN + DCN-v2), with a production-style serving path."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Ayaan Arif" }]

dependencies = [
    "numpy>=1.26,<2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "lightgbm>=4.5",
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "faiss-cpu>=1.8",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "requests>=2.32",
    "typer>=0.12",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "fakeredis>=2.24",
    "locust>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_recsys"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "C4", "PTH", "RET"]
ignore = ["E501", "B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"scripts/*" = ["ARG"]

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "artifacts"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires the full MIND dataset or a trained model",
    "integration: requires redis or a running server",
]
filterwarnings = ["ignore::DeprecationWarning"]
